[package]
name = "magic-mirror"
version = "0.1.0"
edition = "2021"

[lib]
name = "magic_mirror_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aws-smithy-types = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-sts = "1"
tokio = { version = "1", features = ["sync", "process", "macros", "rt-multi-thread"] }
async-trait = "0.1"
futures = "0.3"
aws-sdk-ec2 = "1"
aws-sdk-s3 = "1"
aws-sdk-lambda = "1"
aws-sdk-rds = "1"
aws-sdk-ecs = "1"
aws-sdk-eks = "1"
aws-sdk-iam = "1"
aws-sdk-route53 = "1"
aws-sdk-cloudfront = "1"
aws-sdk-dynamodb = "1"
aws-sdk-cloudwatchlogs = "1"

[dev-dependencies]
tempfile = "3"
