[package]
name = "magic-mirror"
version = "0.5.0"
edition = "2021"

[lib]
name = "magic_mirror_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mime_guess = "2.0.5"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aws-smithy-types = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-config = { version = "1", features = ["behavior-version-latest", "credentials-login"] }
aws-credential-types = "1"
aws-sdk-sts = "1"
tokio = { version = "1", features = ["sync", "process", "macros", "rt-multi-thread", "fs", "io-util", "time"] }
async-trait = "0.1"
futures = "0.3"
aws-sdk-ec2 = "1"
aws-sdk-s3 = "1"
aws-sdk-lambda = "1"
aws-sdk-rds = "1"
aws-sdk-ecs = "1"
aws-sdk-eks = "1"
aws-sdk-iam = "1"
aws-sdk-route53 = "1"
aws-sdk-cloudfront = "1"
aws-sdk-dynamodb = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-sqs = "1"
aws-sdk-sns = "1"
aws-sdk-ecr = "1"
aws-sdk-secretsmanager = "1"
md-5 = "0.10"
similar = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
aws-sdk-elasticloadbalancingv2 = "1"
tauri-plugin-dialog = "2"
aws-sdk-accessanalyzer = "1"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
# 문장에 넣는 이름과 값의 이스케이프(`pg::sql`)와 SCRAM-SHA-256 검증값(`pg::password`). 둘 다 tokio-postgres가 이미 쓰는 크레이트라 새로 받는 것은 없다
postgres-protocol = "0.6"
rand = "0.10"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }

[dev-dependencies]
tempfile = "3"
# 테스트의 가짜 PostgreSQL 서버가 로컬 TCP를 연다
tokio = { version = "1", features = ["net"] }
# 테스트용 CA와 서버 인증서를 그때그때 만들고(비밀 키를 저장소에 두지 않는다), 가짜 서버가 TLS를 받는다
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent"] }
