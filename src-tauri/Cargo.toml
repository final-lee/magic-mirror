[package]
name = "magic-mirror"
version = "0.1.0"
edition = "2021"

[lib]
name = "magic_mirror_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mime_guess = "2.0.5"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aws-smithy-types = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-sts = "1"
tokio = { version = "1", features = ["sync", "process", "macros", "rt-multi-thread", "fs", "io-util", "time"] }
async-trait = "0.1"
futures = "0.3"
aws-sdk-ec2 = "1"
aws-sdk-s3 = "1"
aws-sdk-lambda = "1"
aws-sdk-rds = "1"
aws-sdk-ecs = "1"
aws-sdk-eks = "1"
aws-sdk-iam = "1"
aws-sdk-route53 = "1"
aws-sdk-cloudfront = "1"
aws-sdk-dynamodb = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-sqs = "1"
aws-sdk-sns = "1"
aws-sdk-ecr = "1"
aws-sdk-secretsmanager = "1"
md-5 = "0.10"
similar = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
aws-sdk-elasticloadbalancingv2 = "1"
tauri-plugin-dialog = "2"
aws-sdk-accessanalyzer = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent"] }
