[package]
name = "magic-mirror"
version = "0.14.0"
edition = "2021"

[lib]
name = "magic_mirror_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mime_guess = "2.0.5"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
keyring = { version = "3", features = ["apple-native"] }
aws-smithy-types = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-config = { version = "1", features = ["behavior-version-latest", "credentials-login"] }
aws-credential-types = "1"
aws-sdk-sts = "1"
tokio = { version = "1", features = ["sync", "process", "macros", "rt-multi-thread", "fs", "io-util", "time", "net"] }
async-trait = "0.1"
futures = "0.3"
aws-sdk-ec2 = "1"
aws-sdk-s3 = "1"
aws-sdk-lambda = "1"
aws-sdk-rds = "1"
aws-sdk-elasticache = "1"
aws-sdk-ecs = "1"
aws-sdk-eks = "1"
# EKS 탭: kubeconfig의 exec 플러그인으로 접속하는 쿠버네티스 클라이언트. TLS는 앱의 다른 곳처럼 rustls + aws-lc-rs만 쓴다
kube = { version = "4.2", default-features = false, features = ["client", "config", "runtime", "ws", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "0.28", features = ["v1_33"] }
# 보기용 YAML과 Secret 값 풀기. 둘 다 kube-client가 이미 쓰는 크레이트(같은 버전)라 새로 받는 것은 없다
serde-saphyr = "0.0.29"
base64 = "0.22"
# Helm 릴리스(`release` 데이터는 base64 + gzip JSON)를 풀고, 업그레이드·설치할 때 만드는 임시 차트 폴더. 둘 다 이미 의존성 그래프에 있다
flate2 = "1"
tempfile = "3"
libc = "0.2"
# EKS 앱 안 터미널: 사용자의 로그인 셸을 PTY(의사 터미널)에 띄운다. 표준 라이브러리 Command는 제어 터미널·창 크기(SIGWINCH)를 다루지 못해서 필요하다. PTY 열기·크기 변경·자식 종료만 쓴다.
portable-pty = "0.9"
aws-sdk-iam = "1"
aws-sdk-route53 = "1"
aws-sdk-cloudfront = "1"
aws-sdk-dynamodb = "1"
aws-sdk-cloudwatchlogs = "1"
# 리소스 상세의 CloudWatch 지표(GetMetricData만, 읽기 전용)
aws-sdk-cloudwatch = "1"
aws-sdk-sqs = "1"
aws-sdk-sns = "1"
aws-sdk-ecr = "1"
aws-sdk-secretsmanager = "1"
md-5 = "0.10"
sha2 = "0.10"
similar = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
aws-sdk-elasticloadbalancingv2 = "1"
tauri-plugin-dialog = "2"
# ArgoCD 탭 macOS 알림(Degraded·작업 실패·OutOfSync 지속)
tauri-plugin-notification = "2"
# KV 탭(ElastiCache Valkey·Redis OSS, 읽기 전용): Redis 클라이언트. 명령은 전부 `kv::command`의 허용 목록 관문을 거쳐 `custom`으로만 보내므로 i-* 명령 모음은 켜지 않는다.
# TLS는 앱의 다른 곳처럼 rustls + aws-lc-rs만 쓴다(`enable-rustls`는 ring을 켜지 않는다)
fred = { version = "10.1", default-features = false, features = ["enable-rustls", "credential-provider"] }
# KV 탭: 시스템 루트 인증서, IAM 토큰 서명(SigV4)과 그 URL 쓰기. 셋 다 이미 의존성 그래프에 있다(같은 버전)
rustls-native-certs = "0.8"
aws-sigv4 = "1"
url = "2"
aws-sdk-accessanalyzer = "1"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
# 문장에 넣는 이름과 값의 이스케이프(`pg::sql`)와 SCRAM-SHA-256 검증값(`pg::password`). 둘 다 tokio-postgres가 이미 쓰는 크레이트라 새로 받는 것은 없다
postgres-protocol = "0.6"
rand = "0.10"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
aws-sdk-costexplorer = "1"
rust_decimal = "1"
# Argo CronWorkflow의 다음 실행 시각(시간대 포함). chrono는 kube가 이미 쓰는 크레이트다
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
croner = "4"

[dev-dependencies]
tempfile = "3"
# 테스트의 가짜 PostgreSQL 서버가 로컬 TCP를 연다. test-util: watch 재시작 시험이 멈춘 시계(start_paused)로 기다림을 건너뛴다
tokio = { version = "1", features = ["net", "test-util"] }
# 테스트용 CA와 서버 인증서를 그때그때 만들고(비밀 키를 저장소에 두지 않는다), 가짜 서버가 TLS를 받는다
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent"] }

# macOS 기본값(unpacked)은 디버그 정보용 .o를 target/debug/deps에 남기고 다시 빌드할 때마다 새로 쌓아 지우지 않는다(한 달에 100GB 넘게 자랐다).
# packed는 링크할 때 .dSYM으로 모으고 .o를 지운다. 의존성에는 디버그 정보를 넣지 않아 dsymutil이 빨라지고 다시 빌드 시간도 줄어든다.
[profile.dev]
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false
